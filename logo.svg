<svg width="220" height="220" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="45%" stop-color="#7B5CFF"/>
      <stop offset="80%" stop-color="#3AD9A5"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="50%" stop-color="#7B5CFF"/>
      <stop offset="100%" stop-color="#3AD9A5"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="110" cy="110" r="95" stroke="url(#ring)" stroke-width="8" fill="none" opacity="0.9"/>

  <!-- Inner orb -->
  <circle cx="110" cy="110" r="70" fill="url(#orb)" opacity="0.85"/>

  <!-- Sovereign “S” slash -->
  <path d="M70 140 L150 80" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <path d="M70 80 L150 140" stroke="#4F8CFF" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
</svg>
