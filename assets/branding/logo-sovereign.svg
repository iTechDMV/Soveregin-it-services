<svg viewBox="0 0 260 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sovereignAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="50%" stop-color="#7B5CFF"/>
      <stop offset="100%" stop-color="#3AD9A5"/>
    </linearGradient>
  </defs>

  <!-- Shield / Sovereign mark -->
  <g transform="translate(10,8)">
    <path d="M20 0 L40 6 L40 26 C40 34 33 41 20 46 C7 41 0 34 0 26 L0 6 Z"
          fill="rgba(5,6,10,0.95)"
          stroke="url(#sovereignAccent)"
          stroke-width="2"/>
    <!-- Inner circuit S -->
    <path d="M10 12 C 16 8, 24 8, 30 12
             C 34 15, 34 21, 30 24
             C 24 28, 16 28, 10 32"
          fill="none"
          stroke="#4F8CFF"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-dasharray="3 4"/>
    <circle cx="10" cy="12" r="2.2" fill="#3AD9A5"/>
    <circle cx="30" cy="24" r="2.2" fill="#3AD9A5"/>
  </g>

  <!-- Text -->
  <g transform="translate(70,18)">
    <text x="0" y="16"
          fill="url(#sovereignAccent)"
          font-family="system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', sans-serif"
          font-size="20"
          font-weight="600"
          letter-spacing="2">
      SOVEREIGN
    </text>
    <text x="0" y="34"
          fill="#a3acc7"
          font-family="system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', sans-serif"
          font-size="11"
          letter-spacing="3">
      IT SERVICES
    </text>
  </g>
</svg>
