<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="zoneBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="50%" stop-color="#7B5CFF"/>
      <stop offset="100%" stop-color="#3AD9A5"/>
    </linearGradient>
  </defs>

  <!-- ZONES -->
  <rect x="40" y="60" width="220" height="260" rx="16"
        fill="rgba(5,6,10,0.9)" stroke="url(#zoneBorder)" stroke-width="1.5"/>
  <text x="60" y="90" fill="#a3acc7" font-size="12" letter-spacing="2">TRIBAL GOVERNMENT</text>

  <rect x="290" y="40" width="220" height="160" rx="16"
        fill="rgba(5,6,10,0.9)" stroke="url(#zoneBorder)" stroke-width="1.5"/>
  <text x="310" y="70" fill="#a3acc7" font-size="12" letter-spacing="2">CLOUD PLATFORM</text>

  <rect x="290" y="220" width="220" height="160" rx="16"
        fill="rgba(5,6,10,0.9)" stroke="url(#zoneBorder)" stroke-width="1.5"/>
  <text x="310" y="250" fill="#a3acc7" font-size="12" letter-spacing="2">DATA CENTER</text>

  <rect x="550" y="120" width="220" height="200" rx="16"
        fill="rgba(5,6,10,0.9)" stroke="url(#zoneBorder)" stroke-width="1.5"/>
  <text x="570" y="150" fill="#a3acc7" font-size="12" letter-spacing="2">EDGE / FIELD SITES</text>

  <!-- LINES -->
  <path id="link-gov-cloud" class="arch-line"
        d="M260 190 C 310 150, 330 130, 380 120" />
  <path id="link-gov-dc" class="arch-line"
        d="M260 210 C 310 240, 330 260, 380 280" />
  <path id="link-cloud-edge" class="arch-line"
        d="M510 140 C 560 150, 580 170, 600 190" />
  <path id="link-dc-edge" class="arch-line"
        d="M510 300 C 560 290, 580 260, 600 230" />

  <!-- NODES -->
  <circle class="arch-node" cx="260" cy="190" r="6" />
  <circle class="arch-node" cx="260" cy="210" r="6" />
  <circle class="arch-node" cx="380" cy="120" r="6" />
  <circle class="arch-node" cx="380" cy="280" r="6" />
  <circle class="arch-node" cx="600" cy="190" r="6" />
  <circle class="arch-node" cx="600" cy="230" r="6" />

  <!-- PACKETS -->
  <circle class="arch-packet" r="4">
    <animateMotion dur="4s" repeatCount="indefinite">
      <mpath xlink:href="#link-gov-cloud" />
    </animateMotion>
  </circle>

  <circle class="arch-packet" r="4">
    <animateMotion dur="5.5s" repeatCount="indefinite" begin="1.5s">
      <mpath xlink:href="#link-gov-dc" />
    </animateMotion>
  </circle>

  <circle class="arch-packet" r="4">
    <animateMotion dur="4.5s" repeatCount="indefinite" begin="0.8s">
      <mpath xlink:href="#link-cloud-edge" />
    </animateMotion>
  </circle>

  <circle class="arch-packet" r="4">
    <animateMotion dur="6s" repeatCount="indefinite" begin="2s">
      <mpath xlink:href="#link-dc-edge" />
    </animateMotion>
  </circle>
</svg>

