<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="neonA" x1="0" x2="1">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="0.5" stop-color="#7B5CFF"/>
      <stop offset="1" stop-color="#3AD9A5"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .zone { fill: rgba(10,12,20,0.6); stroke: url(#neonA); stroke-width: 1.5; filter: url(#glow); }
      .zone-label { fill: #cfe6ff; font-family: Inter, system-ui, Arial; font-size: 13px; letter-spacing: 0.06em; }
      .node { fill: #0b1220; stroke: #4F8CFF; stroke-width: 2; r: 8; filter: url(#glow); }
      .node-core { fill: #071026; stroke: #7B5CFF; stroke-width: 2.5; r: 12; }
      .link { fill: none; stroke: url(#neonA); stroke-width: 2; stroke-linecap: round; opacity: 0.9; filter: url(#glow); }
      .packet { fill: #fff; stroke: none; r: 3; opacity: 0.95; filter: url(#glow); }
      .hud-grid { stroke: rgba(79,140,255,0.06); stroke-width: 1; }
      .label-muted { fill: rgba(200,220,255,0.7); font-size: 11px; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        70% { transform: scale(1.9); opacity: 0.12; }
        100% { transform: scale(1); opacity: 0; }
      }
      .packet-move { animation: moveAlong 6s linear infinite; }
      @keyframes moveAlong {
        0% { offset-distance: 0%; }
        100% { offset-distance: 100%; }
      }
    </style>
  </defs>

  <g id="hud">
    <rect x="20" y="20" width="1160" height="680" rx="14" fill="transparent" stroke="rgba(79,140,255,0.03)"/>
    <g class="hud-grid" opacity="0.06">
      <g>
        <line x1="60" y1="40" x2="60" y2="700"/>
        <line x1="180" y1="40" x2="180" y2="700"/>
        <line x1="300" y1="40" x2="300" y2="700"/>
        <line x1="420" y1="40" x2="420" y2="700"/>
        <line x1="540" y1="40" x2="540" y2="700"/>
        <line x1="660" y1="40" x2="660" y2="700"/>
        <line x1="780" y1="40" x2="780" y2="700"/>
        <line x1="900" y1="40" x2="900" y2="700"/>
        <line x1="1020" y1="40" x2="1020" y2="700"/>
      </g>
      <g>
        <line x1="40" y1="80" x2="1160" y2="80"/>
        <line x1="40" y1="160" x2="1160" y2="160"/>
        <line x1="40" y1="240" x2="1160" y2="240"/>
        <line x1="40" y1="320" x2="1160" y2="320"/>
        <line x1="40" y1="400" x2="1160" y2="400"/>
        <line x1="40" y1="480" x2="1160" y2="480"/>
        <line x1="40" y1="560" x2="1160" y2="560"/>
        <line x1="40" y1="640" x2="1160" y2="640"/>
      </g>
    </g>
  </g>

  <g id="tribal-zone" transform="translate(120,120)">
    <rect x="0" y="0" width="260" height="180" rx="12" class="zone" fill-opacity="0.06"/>
    <text x="14" y="22" class="zone-label">Tribal Government</text>
    <image href="assets/icons/tribal-mark.svg" x="18" y="36" width="56" height="56" opacity="0.98"/>
    <circle class="node-core" cx="160" cy="60" r="12"/>
    <circle class="node" cx="80" cy="120" r="8"/>
    <circle class="node" cx="200" cy="120" r="8"/>
    <circle cx="160" cy="60" r="28" fill="#4F8CFF" opacity="0.08" class="pulse"/>
    <text x="18" y="160" class="label-muted">Data sovereignty · local control</text>
  </g>

  <g id="cloud-zone" transform="translate(420,60)">
    <rect x="0" y="0" width="320" height="220" rx="12" class="zone" fill-opacity="0.05"/>
    <text x="14" y="22" class="zone-label">Cloud Zone</text>
    <image href="assets/icons/cloud.svg" x="18" y="36" width="64" height="64" opacity="0.98"/>
    <circle class="node-core" cx="220" cy="80" r="12"/>
    <circle class="node" cx="120" cy="140" r="8"/>
    <circle class="node" cx="260" cy="140" r="8"/>
    <text x="18" y="190" class="label-muted">AWS · Azure landing zones · identity</text>
  </g>

  <g id="dc-zone" transform="translate(780,120)">
    <rect x="0" y="0" width="300" height="180" rx="12" class="zone" fill-opacity="0.05"/>
    <text x="14" y="22" class="zone-label">Data Center</text>
    <image href="assets/icons/datacenter.svg" x="18" y="36" width="64" height="64" opacity="0.98"/>
    <circle class="node-core" cx="160" cy="60" r="12"/>
    <circle class="node" cx="80" cy="120" r="8"/>
    <circle class="node" cx="240" cy="120" r="8"/>
    <text x="18" y="160" class="label-muted">On‑prem systems · backups · DR</text>
  </g>

  <g id="edge-zone" transform="translate(120,340)">
    <rect x="0" y="0" width="260" height="160" rx="12" class="zone" fill-opacity="0.05"/>
    <text x="14" y="22" class="zone-label">Edge & Field Sites</text>
    <image href="assets/icons/surveillance-dome.svg" x="18" y="36" width="56" height="56" opacity="0.98"/>
    <image href="assets/icons/fiber-node.svg" x="90" y="36" width="56" height="56" opacity="0.98"/>
    <circle class="node" cx="180" cy="100" r="8"/>
    <circle class="node" cx="60" cy="100" r="8"/>
    <text x="14" y="140" class="label-muted">Remote sites · fiber · VMS</text>
  </g>

  <g id="soc-zone" transform="translate(420,320)">
    <rect x="0" y="0" width="320" height="160" rx="12" class="zone" fill-opacity="0.06"/>
    <text x="14" y="22" class="zone-label">SOC & Security Operations</text>
    <image href="assets/icons/soc-screen.svg" x="18" y="36" width="64" height="64" opacity="0.98"/>
    <image href="assets/icons/zero-trust.svg" x="100" y="36" width="56" height="56" opacity="0.98"/>
    <circle class="node-core" cx="220" cy="80" r="12"/>
    <circle class="node" cx="120" cy="120" r="8"/>
    <circle cx="220" cy="80" r="28" fill="#7B5CFF" opacity="0.06" class="pulse"/>
    <text x="18" y="140" class="label-muted">24/7 monitoring · XDR · IR</text>
  </g>

  <g id="network-zone" transform="translate(780,340)">
    <rect x="0" y="0" width="300" height="160" rx="12" class="zone" fill-opacity="0.05"/>
    <text x="14" y="22" class="zone-label">Network & Zero Trust</text>
    <image href="assets/icons/network.svg" x="18" y="36" width="56" height="56" opacity="0.98"/>
    <image href="assets/icons/access-control.svg" x="90" y="36" width="56" height="56" opacity="0.98"/>
    <circle class="node" cx="160" cy="80" r="8"/>
    <text x="18" y="140" class="label-muted">SD‑WAN · segmentation · access control</text>
  </g>

  <g id="links">
    <path class="link" d="M280 200 C360 160, 420 120, 460 120" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="link" d="M740 180 C760 220, 740 260, 740 320" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="link" d="M900 200 C920 260, 920 320, 900 360" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="link" d="M260 420 C360 380, 420 360, 460 360" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="link" d="M740 380 C820 380, 860 380, 900 380" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <g id="packets">
    <path id="p1" d="M280 200 C360 160, 420 120, 460 120" fill="none" stroke="transparent"/>
    <circle class="packet packet-move" r="4" style="offset-path: path('M280 200 C360 160, 420 120, 460 120'); animation-duration: 6s; animation-delay: 0s;"/>
    <path id="p2" d="M740 180 C760 220, 740 260, 740 320" fill="none" stroke="transparent"/>
    <circle class="packet packet-move" r="4" style="offset-path: path('M740 180 C760 220, 740 260, 740 320'); animation-duration: 5.2s; animation-delay: 0.8s;"/>
    <path id="p3" d="M260 420 C360 380, 420 360, 460 360" fill="none" stroke="transparent"/>
    <circle class="packet packet-move" r="4" style="offset-path: path('M260 420 C360 380, 420 360, 460 360'); animation-duration: 7s; animation-delay: 1.6s;"/>
    <path id="p4" d="M740 380 C820 380, 860 380, 900 380" fill="none" stroke="transparent"/>
    <circle class="packet packet-move" r="4" style="offset-path: path('M740 380 C820 380, 860 380, 900 380'); animation-duration: 5.6s; animation-delay: 0.4s;"/>
  </g>

  <g transform="translate(36, 680)">
    <rect x="0" y="-48" width="1128" height="44" rx="8" fill="rgba(5,8,16,0.45)" stroke="rgba(79,140,255,0.06)"/>
    <text x="12" y="-20" class="label-muted">Live model · nodes pulse on activity · packets show flow</text>
    <text x="980" y="-20" class="label-muted">Last updated: LIVE</text>
  </g>
</svg>
