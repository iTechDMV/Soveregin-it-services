<svg width="1200" height="700" viewBox="0 0 1200 700"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="1200" height="700" fill="#0d1117"/>

  <!-- Tribal geometry -->
  <path d="M0 600L600 450L1200 600"
        stroke="#22d3ee" stroke-width="2" opacity="0.15" fill="none"/>
  <path d="M0 650L600 500L1200 650"
        stroke="#22c55e" stroke-width="2" opacity="0.12" fill="none"/>

  <!-- Section titles -->
  <text x="100" y="80" fill="#22d3ee" font-family="Poppins" font-size="28">
    Tribal Government
  </text>
  <text x="500" y="80" fill="#22d3ee" font-family="Poppins" font-size="28">
    Data Center
  </text>
  <text x="900" y="80" fill="#22d3ee" font-family="Poppins" font-size="28">
    Cloud (AWS / Azure)
  </text>

  <!-- Tribal Government Node -->
  <rect x="60" y="120" width="220" height="140" rx="12"
        stroke="#22d3ee" stroke-width="3" fill="#111827"/>
  <text x="90" y="200" fill="#22c55e" font-family="Inter" font-size="20">
    Identity • Governance
  </text>

  <!-- Data Center Node -->
  <rect x="460" y="120" width="280" height="140" rx="12"
        stroke="#22d3ee" stroke-width="3" fill="#111827"/>
  <text x="500" y="200" fill="#22c55e" font-family="Inter" font-size="20">
    Servers • Storage • SIEM
  </text>

  <!-- Cloud Node -->
  <rect x="840" y="120" width="280" height="140" rx="12"
        stroke="#22d3ee" stroke-width="3" fill="#111827"/>
  <text x="880" y="200" fill="#22c55e" font-family="Inter" font-size="20">
    Compute • IAM • Analytics
  </text>

  <!-- Connectors -->
  <path d="M280 190H460" stroke="#22d3ee" stroke-width="3"/>
  <path d="M740 190H840" stroke="#22d3ee" stroke-width="3"/>

  <!-- Security Layers -->
  <text x="100" y="340" fill="#22d3ee" font-family="Poppins" font-size="26">
    Security Layers
  </text>

  <!-- Layer Boxes -->
  <g>
    <rect x="60" y="360" width="240" height="80" rx="10"
          stroke="#22c55e" stroke-width="3" fill="#111827"/>
    <text x="120" y="410" fill="#22d3ee" font-family="Inter" font-size="20">
      Identity
    </text>

    <rect x="340" y="360" width="240" height="80" rx="10"
          stroke="#22c55e" stroke-width="3" fill="#111827"/>
    <text x="400" y="410" fill="#22d3ee" font-family="Inter" font-size="20">
      Application
    </text>

    <rect x="620" y="360" width="240" height="80" rx="10"
          stroke="#22c55e" stroke-width="3" fill="#111827"/>
    <text x="700" y="410" fill="#22d3ee" font-family="Inter" font-size="20">
      Data
    </text>

    <rect x="900" y="360" width="240" height="80" rx="10"
          stroke="#22c55e" stroke-width="3" fill="#111827"/>
    <text x="960" y="410" fill="#22d3ee" font-family="Inter" font-size="20">
      Network
    </text>
  </g>

  <!-- Layer Connectors -->
  <path d="M300 400H340" stroke="#22d3ee" stroke-width="3"/>
  <path d="M580 400H620" stroke="#22d3ee" stroke-width="3"/>
  <path d="M860 400H900" stroke="#22d3ee" stroke-width="3"/>

  <!-- Subscribers -->
  <text x="520" y="540" fill="#22d3ee" font-family="Poppins" font-size="26">
    Subscribers / Endpoints
  </text>

  <circle cx="600" cy="600" r="40"
          stroke="#22d3ee" stroke-width="4" fill="#111827"/>
  <circle cx="600" cy="600" r="12" fill="#22c55e"/>
</svg>
