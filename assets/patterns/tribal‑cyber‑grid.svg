<svg width="400" height="400" viewBox="0 0 400 400"
     xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#0d1117"/>

  <!-- Grid -->
  <g stroke="#1f2937" stroke-width="1" opacity="0.35">
    <path d="M0 50H400"/>
    <path d="M0 100H400"/>
    <path d="M0 150H400"/>
    <path d="M0 200H400"/>
    <path d="M0 250H400"/>
    <path d="M0 300H400"/>
    <path d="M0 350H400"/>

    <path d="M50 0V400"/>
    <path d="M100 0V400"/>
    <path d="M150 0V400"/>
    <path d="M200 0V400"/>
    <path d="M250 0V400"/>
    <path d="M300 0V400"/>
    <path d="M350 0V400"/>
  </g>

  <!-- Tribal diagonals -->
  <g stroke="#22d3ee" stroke-width="1.5" opacity="0.15">
    <path d="M0 0L400 400"/>
    <path d="M400 0L0 400"/>
  </g>

  <!-- Glow node -->
  <circle cx="200" cy="200" r="4" fill="#22c55e" opacity="0.5"/>
</svg>
