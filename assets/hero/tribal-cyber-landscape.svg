<svg width="1440" height="600" viewBox="0 0 1440 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="600">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="mesh" x1="0" y1="0" x2="1440" y2="600">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="600" fill="url(#sky)"/>

  <!-- Tribal geometric pattern -->
  <path d="M0 450 L720 300 L1440 450" stroke="url(#mesh)" stroke-width="2" fill="none" opacity="0.35"/>
  <path d="M0 500 L720 350 L1440 500" stroke="url(#mesh)" stroke-width="2" fill="none" opacity="0.25"/>

  <!-- Cyber mesh grid -->
  <g stroke="#22d3ee" stroke-opacity="0.15" stroke-width="1">
    <path d="M0 400 H1440"/>
    <path d="M0 450 H1440"/>
    <path d="M0 500 H1440"/>
    <path d="M0 550 H1440"/>
    <path d="M200 300 V600"/>
    <path d="M400 300 V600"/>
    <path d="M600 300 V600"/>
    <path d="M800 300 V600"/>
    <path d="M1000 300 V600"/>
    <path d="M1200 300 V600"/>
  </g>

  <!-- Glow nodes -->
  <circle cx="720" cy="350" r="6" fill="#22d3ee" opacity="0.8"/>
  <circle cx="360" cy="420" r="4" fill="#22c55e" opacity="0.7"/>
  <circle cx="1080" cy="420" r="4" fill="#22c55e" opacity="0.7"/>
</svg>
